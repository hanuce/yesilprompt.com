<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeşil Prompt Resim Galerisi</title>
  <meta name="description" content="Her eserin altında çevre maliyetinin yer aldığı, yapay zekâ ile üretilmiş kürasyonlu bir resim galerisi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="gal-page">

  <!-- ===== BAŞLIK ===== -->
  <header class="gal-head">
    <h1 class="gal-title">Yeşil Prompt <span class="text-grad">Resim Galerisi</span></h1>
  </header>

  <!-- ===== ESERLER (menü ve açıklama yok) ===== -->
  <main id="gallery" class="gal-grid" aria-label="Yeşil Prompt Resim Galerisi"></main>

  <!-- ===== SAĞ ALT: yüzen düğme ===== -->
  <div class="fab-dock">

    <a id="sergiCta" class="fab fab-primary" href="atolye.html" aria-label="Atölyeye gir">
      <span class="fab-label">Atölyeye gir</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <path d="M10 16.5 14.5 12 10 7.5"/>
        <path d="M14.5 12H3.5"/>
      </svg>
    </a>

  </div>

  <!-- ===== LIGHTBOX ===== -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Eser detayı" hidden>
    <button id="boxClose" class="box-btn box-close" type="button" aria-label="Kapat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    <button id="boxPrev" class="box-btn box-prev" type="button" aria-label="Önceki eser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 5 7.5 12l7 7"/>
      </svg>
    </button>
    <button id="boxNext" class="box-btn box-next" type="button" aria-label="Sonraki eser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.5 5l7 7-7 7"/>
      </svg>
    </button>

    <div class="box-stage" id="boxMedia"></div>
    <div class="box-bar" id="boxInfo"></div>
  </div>

  <!-- ===== SCRIPTLER ===== -->
  <script src="assets/js/config/units.config.js"></script>
  <script src="assets/js/config/site.config.js"></script>
  <script src="assets/js/core/units.js"></script>
  <script src="assets/js/pages/anasayfa.js"></script>
</body>
</html>
